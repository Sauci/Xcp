name: test

on: [ push ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{github.repository}}

jobs:
  build-and-push-image:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{steps.meta.outputs.tags}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{secrets.PKG_REGISTRY_USERNAME}}
          password: ${{secrets.PKG_REGISTRY_RW_TOKEN}}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}
          # A tag naming the commit, so the test job below runs against the image built from
          # this very ref. The branch tag alone is not enough: it resolves to whatever was last
          # pushed for that branch.
          tags: type=sha,format=long,prefix=
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
  run-tests:
    name: Run tests
    needs: build-and-push-image
    runs-on: ubuntu-latest
    container:
      # Built from this commit by the job above. Previously hardcoded to :develop, which meant
      # every branch ran its tests inside whatever image develop last produced -- so a change to
      # requirements.txt or the Dockerfile was never actually exercised by the branch making it.
      image: ${{needs.build-and-push-image.outputs.image}}
      credentials:
        username: ${{secrets.PKG_REGISTRY_USERNAME}}
        password: ${{secrets.PKG_REGISTRY_RW_TOKEN}}
      volumes:
        - ${{github.workspace}}:/usr/project
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run pytest tests
        run: ./test.sh
      - name: Upload code coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./build/Xcp.c.gcov,./build/Xcp_Std.c.gcov,./build/Xcp_Cal.c.gcov,./build/Xcp_Pag.c.gcov,./build/Xcp_Daq.c.gcov
